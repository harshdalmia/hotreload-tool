name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this in step with the `go` directive in go.mod.
  GO_VERSION: "1.25.x"

jobs:
  # Formatting, vet, tidiness and linting only need to run once.
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run 'make fmt' to fix them."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # The process and watcher packages are the platform-specific parts of this
  # project, so the test matrix has to cover all three OSes to be worth much.
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./... -short -count=1

      - name: End-to-end tests
        run: go test ./e2e/ -count=1 -timeout 20m

  # The race detector needs cgo, which is most reliable on Linux runners.
  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with -race
        run: go test -race ./... -count=1 -timeout 25m

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate coverage
        run: go test ./... -short -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Report totals
        run: go tool cover -func=coverage.out | tail -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # Prove the release build works before a tag depends on it.
  release-dryrun:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean
