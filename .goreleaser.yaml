# GoReleaser configuration for hotreload.
#
# Local check:  goreleaser check
# Local build:  goreleaser build --snapshot --clean
# Release:      git tag v1.2.3 && git push origin v1.2.3  (CI does the rest)

version: 2

project_name: hotreload

before:
  hooks:
    # Deliberately no `go mod tidy` here: a release build must not mutate the
    # module files it is building from. Tidiness is enforced in CI instead.
    - go test ./... -short -count=1

builds:
  - id: hotreload
    main: ./cmd/hotreload
    binary: hotreload
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM64 is not a meaningful target for a dev tool yet.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - hotreload
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - ARCHITECTURE.md
      - LICENSE
      - .hotreload.example.toml

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    Download the archive for your platform above, or build from source:

    ```
    go install github.com/harshdalmia/hotreload-tool/cmd/hotreload@{{ .Tag }}
    ```
