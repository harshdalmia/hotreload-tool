# Example hotreload configuration.
#
# Copy this to .hotreload.toml in your project root and hotreload will pick it
# up automatically. Flags you pass on the command line override anything set
# here, so you can keep the common case in the file and still say
# `hotreload --verbose` for a one-off run.
#
# Every key is optional except build and exec.

# Directory watched recursively. Relative paths resolve against the working
# directory hotreload is started from.
root = "."

# Command run when a change is detected. Anything your shell understands works,
# including pipes and redirects.
#
# Optional: interpreted projects have nothing to compile, so omitting it means a
# change restarts the server directly. Even then a syntax check is worth putting
# here (python -m compileall -q ., node --check server.js), because a failed
# build leaves the running server untouched.
build = "go build -o ./bin/app ./cmd/app"

# Command that runs the built artefact.
exec = "./bin/app"

# Runs before every build. Code generation belongs here: templ generate,
# sqlc generate, protoc. A failure aborts the reload and leaves the running
# server alone, exactly like a failed build, because the build would otherwise
# compile stale or missing generated code.
pre_cmd = ""

# Runs after the server has started. Intended for side effects such as seeding a
# database or pinging a health check. A failure is reported but changes nothing,
# since the server is already up.
post_cmd = ""

# Detect changes by rescanning the tree instead of subscribing to filesystem
# notifications. Turn this on where notifications never arrive: the host side of
# a Docker bind mount, some network filesystems, certain WSL setups. Without it
# hotreload appears to start correctly there and then simply never reloads.
poll = false

# How often to rescan in poll mode. Reload latency is bounded by this.
poll_interval = "500ms"

# Quiet window after the last change before rebuilding. Editors emit several
# events per save, so a small window collapses them into one reload.
# Durations use Go syntax: "150ms", "1s", "2m".
debounce = "150ms"

# How long a process gets to shut down gracefully before it is force-killed.
# Raise this if your server needs longer to drain connections.
kill_delay = "5s"

# Only rebuild when a file with one of these extensions changes. Leave it out
# (or empty) to rebuild for any non-ignored file. Setting it is what stops a
# README edit from triggering a compile.
include_ext = [".go", ".tmpl", ".html"]

# Extra directory names to ignore, on top of the built-in set (.git,
# node_modules, vendor, bin, dist, build, target, obj, venv, coverage, tmp,
# temp, __pycache__, any dot-directory, and a few editor caches).
#
# Build output is already covered. That is deliberate: build tools rewrite files
# in their output directory on every run, so watching one turns a single save
# into an endless rebuild loop.
exclude_dir = ["testdata", "docs"]

# Directory names to watch even though they are ignored by default. This is the
# only way to watch a directory named build/, dist/, tmp/, or anything starting
# with a dot.
include_dir = []

# Debug logging: every event, every filter decision, every process transition.
verbose = false
